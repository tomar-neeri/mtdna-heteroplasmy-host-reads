# Fully pinned. Reproducibility depends on these exact versions.
name: base
channels: [conda-forge, bioconda]
dependencies:
  - python=3.11.9
  - bwa=0.7.18
  - samtools=1.20
  - bcftools=1.20
  - mosdepth=0.3.8
  - fastp=0.23.4
  - seqkit=2.8.2
  - bedtools=2.31.1
  - kraken2=2.1.3
  - gatk4=4.5.0.0
  - openjdk=17.0.11
  - snakemake-minimal=8.14.0
  - pysam=0.22.1
  - pandas=2.2.2
  - numpy=1.26.4
  - scipy=1.13.1
  - statsmodels=0.14.2
  - matplotlib=3.8.4
  - pyyaml=6.0.1
